name: 'Probe Signin Days'

# 一次性探测：把 k_misign 签到页面上与「天数」有关的文本抓出来，
# 用于在邮件里显示「连续签到 N 天」。用完即删。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Probe
        env:
          GM_USER_COOKIE: ${{ secrets.GM_USER_COOKIE }}
          GM_SPIDER_UA: ${{ secrets.GM_SPIDER_UA }}
          GM_BROWSER_ATTEMPTS: '1'
          GM_SOLVE_TIMEOUT: '45'
        run: |
          python - <<'PY'
          import logging, re, sys
          sys.path.insert(0, '.')
          from gm_gate import HttpEngine, GateKeeper, GatedSession

          logging.basicConfig(level=logging.INFO, format='%(message)s')
          log = logging.getLogger('probe')

          host = 'www.gamemale.com'
          http = HttpEngine(host, log)
          gate = GateKeeper(host, log, browser_path=None)
          sess = GatedSession(http, gate, log)
          log.info('GATE MODE = %s' % gate.ensure_access(http))

          base = 'https://%s' % host
          body = sess.get(base + '/k_misign-sign.html').text or ''
          log.info('PAGE = %d bytes' % len(body))

          def ctx(kw, pad=500, tag='CTX'):
              i = body.find(kw)
              if i < 0:
                  log.info('%s [%s] NOT FOUND' % (tag, kw))
                  return
              seg = body[max(0, i - pad): i + pad]
              seg = re.sub(r'\s+', ' ', seg)
              log.info('%s [%s] %s' % (tag, kw, seg))

          ctx('连续签到', 600)
          ctx('签到排名', 350)
          ctx('签到等级', 350)

          # 所有 id/class 里带 misign 的容器起始标签，看结构
          for m in re.findall(r'<(?:div|ul|li|p|span|em|strong|a)[^>]{0,180}(?:misign|qiandao|sign)[^>]{0,180}>', body)[:15]:
              log.info('TAG %s' % re.sub(r'\s+', ' ', m)[:200])

          # 「天」字前后 60 字符的原文（不去标签），看数字是否在独立节点
          for m in re.findall(r'.{60}天.{60}', re.sub(r'\s+', ' ', body))[:10]:
              log.info('DAY %s' % m)

          # 已签到时的接口原文
          fm = re.search(r'name="formhash" value="(.+?)"', sess.get(base + '/forum.php').text or '')
          fh = fm.group(1) if fm else ''
          r = sess.get(base + '/k_misign-sign.html?operation=qiandao&format=button&formhash=' + fh)
          log.info('API = %r' % (r.text or '')[:300])
          PY
