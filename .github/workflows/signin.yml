name: 'GameMale Auto Sign-in'

# 触发方式
#  - 每天 00:17（北京时间）全量：破门 → 登录 → 签到 → 抽奖 → 互动 → 抓资产 → 发邮件
#  - 每天 14:43（北京时间）轻量：只做 破门 → 登录 → 抓资产 → 发邮件，避免重复互动触发风控
#  - 也支持在 Actions 页面手动 Run workflow（可选 full / light / check）
on:
  schedule:
    - cron: '17 16 * * *'   # UTC 16:17 = 北京 00:17
    - cron: '43 6 * * *'    # UTC 06:43 = 北京 14:43
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式（full=全量 / light=只抓资产 / check=自检不发邮件）'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - light
          - check

# 关键：金币基准需要 commit + push 回仓库，必须给写权限。
# 若这里不声明，则完全依赖 Settings -> Actions -> General -> Workflow permissions，
# 漏配时表现为"邮件能收到但金币涨幅永远是 +0"，且不会报错。
permissions:
  contents: write

# 避免两次定时任务叠加执行
concurrency:
  group: gm-signin
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 定时任务：第二个 cron 走轻量模式；手动触发则用输入值
      GM_RUN_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode) || (github.event.schedule == '43 6 * * *' && 'light') || 'full' }}
      # ubuntu-latest 上以 runner 用户运行 Chromium 时建议关闭沙箱（上游原版也是这么做的）
      GM_CHROME_NO_SANDBOX: '1'
      # 强制有头：配合下面的 xvfb-run 提供虚拟显示器。
      # Turnstile 对无头内核评分极低（实测无头 90 秒×3 轮必失败，有头约 8 秒自动通过）。
      GM_HEADFUL: '1'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import DrissionPage, ddddocr, curl_cffi, requests; print('deps ok')"

      - name: Install Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Show Chrome Version
        run: google-chrome --version || true

      - name: Check Required Secrets
        # 一秒钟就能看出「到底哪几个 Secret 没配」，省得跑到一半才报错。
        env:
          U: ${{ secrets.GM_USERNAME || secrets.USERNAME }}
          P: ${{ secrets.GM_PASSWORD || secrets.PASSWORD }}
          C: ${{ secrets.GM_USER_COOKIE }}
          K: ${{ secrets.CAPSOLVER_KEY }}
          G: ${{ secrets.GM_GATE_COOKIE }}
        run: |
          echo "GM_USERNAME(GM_*/旧*) : $([ -n "$U" ] && echo 已配置 || echo '!! 缺失')"
          echo "GM_PASSWORD(GM_*/旧*) : $([ -n "$P" ] && echo 已配置 || echo '!! 缺失')"
          echo "GM_USER_COOKIE        : $([ -n "$C" ] && echo 已配置 || echo 未配置（将回退到浏览器破门）)"
          echo "CAPSOLVER_KEY         : $([ -n "$K" ] && echo 已配置 || echo 未配置)"
          echo "GM_GATE_COOKIE        : $([ -n "$G" ] && echo 已配置 || echo 未配置)"
          if [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::缺少账号 Secret。请在 Settings -> Secrets and variables -> Actions 里添加 GM_USERNAME / GM_PASSWORD（旧的 USERNAME / PASSWORD 也认）。"
            exit 1
          fi

      - name: Preflight - Site Gate Probe
        # 只做只读探测，不开浏览器。失败不阻塞主流程，但日志能立刻指认问题在哪一环。
        continue-on-error: true
        env:
          GM_USER_COOKIE: ${{ secrets.GM_USER_COOKIE }}
          GM_GATE_COOKIE: ${{ secrets.GM_GATE_COOKIE }}
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python gm_gate.py 2>&1 | tee preflight.txt

      - name: Run Task Script
        env:
          # 兼容新旧两套 Secret 名：老 README 让填 USERNAME/PASSWORD，新代码读 GM_*，
          # 这里用 || 同时认，避免「明明配了却说缺少账号配置」。
          GM_USERNAME: ${{ secrets.GM_USERNAME || secrets.USERNAME }}
          GM_PASSWORD: ${{ secrets.GM_PASSWORD || secrets.PASSWORD }}
          GM_SMTP_HOST: ${{ secrets.GM_SMTP_HOST || secrets.SMTP_HOST }}
          GM_MAIL_USER: ${{ secrets.GM_MAIL_USER || secrets.MAIL_USER }}
          GM_MAIL_PASS: ${{ secrets.GM_MAIL_PASS || secrets.MAIL_PASS }}
          GM_MAIL_TO: ${{ secrets.GM_MAIL_TO || secrets.MAIL_TO }}
          GM_QUESTIONID: ${{ secrets.GM_QUESTIONID || secrets.QUESTIONID }}
          GM_ANSWER: ${{ secrets.GM_ANSWER || secrets.ANSWER }}
          # 【路线 A·推荐】你自己浏览器的登录 Cookie：
          #   蜘蛛 UA 过门 + 已登录态 => 完全不碰 Turnstile、不需要验证码、不需要浏览器
          GM_USER_COOKIE: ${{ secrets.GM_USER_COOKIE }}
          # 【路线 B】打码平台解 Turnstile（付费但全自动）
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          # 【路线 C 的加速缓存】本地破门一次导出的放行 Cookie（寿命很短，仅作可选优化）
          GM_GATE_COOKIE: ${{ secrets.GM_GATE_COOKIE }}
        run: |
          set -o pipefail   # 少了它，python 失败会被 tee 吞掉，job 假装成功
          # 用 xvfb-run 提供虚拟显示器 -> 脚本会自动切换为「有头」Chrome 过 Turnstile
          EXTRA=""
          if [ "$GM_RUN_MODE" = "check" ]; then EXTRA="--check"; fi
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python gamemale.py $EXTRA 2>&1 | tee run.log

      - name: Commit Asset Record
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f gold_record.txt ]; then
            git add gold_record.txt
            if git diff --cached --quiet; then
              echo "金币无变化，跳过提交"
            else
              git commit -m "chore: 自动更新每日金币对比基准文件"
              git push || echo "!! push 失败：请检查 Settings -> Actions -> General -> Workflow permissions 是否为 Read and write"
            fi
          fi

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm-debug-${{ github.run_number }}
          path: |
            assets_debug.txt
            preflight.txt
            run.log
          if-no-files-found: ignore
          retention-days: 7
